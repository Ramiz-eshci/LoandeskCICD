    .halo{stroke:#e9a825;stroke-width:1;opacity:.5;transform-box:fill-box;transform-origin:center;animation:city-pulse 4s ease-in-out 1}
    @keyframes city-pulse{50%{transform:scale(1.5);opacity:.12}}
    @media(prefers-reduced-motion:reduce){.halo{animation:none}}
