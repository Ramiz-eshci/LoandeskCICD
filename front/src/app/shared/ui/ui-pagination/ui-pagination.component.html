    <div class="pager">
      <span class="pager-count">{{ summary() }}</span>
      <div class="pager-controls">
        <button type="button" class="btn-ghost btn-sm" [disabled]="!hasPrevious()" (click)="previous.emit()">
          Previous
        </button>
        <button type="button" class="btn-ghost btn-sm" [disabled]="!hasNext()" (click)="next.emit()">
          Next
        </button>
      </div>
    </div>
