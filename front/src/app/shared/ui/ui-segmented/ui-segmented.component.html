    <div class="seg" role="group">
      @for (option of options(); track option.key) {
        <button
          type="button"
          class="seg-btn"
          [class.active]="value() === option.key"
          [attr.aria-pressed]="value() === option.key"
          (click)="value.set(option.key)"
        >
          {{ option.label }}
        </button>
      }
    </div>
