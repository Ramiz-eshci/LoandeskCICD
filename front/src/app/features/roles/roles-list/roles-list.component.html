    <ui-page-header title="Roles" [subtitle]="subtitle()">
      <button *appHasPermission="'MASTERS.ROLES_MASTER.add'" uiButton variant="accent" type="button" class="rl-new" (click)="create()">
        <i class="bi bi-plus-lg"></i> New Role
      </button>
    </ui-page-header>

    <div class="rl-filterbar">
      <ui-search-input variant="field" width="360px" placeholder="Search roles…" [(value)]="search" />
      <button uiButton variant="ghost" type="button" (click)="applySearch()"><i class="bi bi-search"></i> Search</button>
    </div>

    @if (error()) {
      <ui-card class="mb-3"><p class="rl-error"><i class="bi bi-exclamation-circle"></i> {{ error() }}</p></ui-card>
    }

    <ui-card bodyClass="">
      <ui-data-table [columns]="columns" [rows]="rows()" [paginate]="false" emptyText="No roles found.">
        <ng-template uiCell="role_name" let-row>
          <div class="rl-name">{{ row.role_name }}</div>
        </ng-template>
        <ng-template uiCell="description" let-row>
          @if (row.description) { <span>{{ row.description }}</span> }
          @else { <span class="text-muted-fg">—</span> }
        </ng-template>
        <ng-template uiCell="is_active" let-row>
          <ui-tag [tone]="row.is_active ? 'success' : 'neutral'">{{ row.is_active ? 'Active' : 'Inactive' }}</ui-tag>
        </ng-template>
        <ng-template uiCell="actions" let-row>
          <div class="rl-actions">
            <button *appHasPermission="'MASTERS.ROLES_MASTER.edit'" uiButton variant="ghost" size="sm" type="button" (click)="edit(row)">
              <i class="bi bi-pencil"></i> Edit
            </button>
            <button *appHasPermission="'MASTERS.ROLES_MASTER.delete'" uiButton variant="ghost" size="sm" type="button" [disabled]="row.role_id === 1" (click)="askDelete(row)">
              <i class="bi bi-trash"></i> Delete
            </button>
          </div>
        </ng-template>
      </ui-data-table>

      <ui-pagination [summary]="pageSummary()" [hasPrevious]="page() > 1" [hasNext]="hasNext()" (previous)="prev()" (next)="next()" />
    </ui-card>

    @if (pendingDelete(); as role) {
      <ui-modal title="Delete role" [subtitle]="role.role_name" (closed)="pendingDelete.set(null)">
        <p>Delete role <strong>{{ role.role_name }}</strong>? Users keep their accounts but lose this role's access.</p>
        <div modalFooter class="rl-modal-footer">
          <button uiButton variant="ghost" type="button" (click)="pendingDelete.set(null)">Cancel</button>
          <button uiButton variant="primary" type="button" (click)="confirmDelete(role)">Delete</button>
        </div>
      </ui-modal>
    }
